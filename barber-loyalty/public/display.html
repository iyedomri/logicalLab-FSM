<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Écran du comptoir — {{SHOP_NAME}}</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
{{TENANT_CSS}}
</head>
<body class="display-body">
  <div class="display-frame">
    <div class="display-stripe top"></div>
    <div class="display-inner">
      <div class="display-brand">
        <div class="brand-mark" style="width:64px;height:64px">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;stroke:var(--green-800);stroke-width:2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        </div>
        <div>
          <div class="display-name">{{SHOP_NAME}}</div>
          <div class="display-tag">{{TAGLINE}}</div>
        </div>
      </div>

      <h1 class="display-headline">Scannez.<br><em>Votre carte vous attend.</em></h1>

      <div class="display-qr-wrap">
        <div class="display-qr"><img id="joinQr" src="{{API_BASE}}/api/counter-qr" alt="QR code d’adhésion à la carte de fidélité" width="512" height="512"></div>
      </div>

      <div class="display-steps">
        <span><b>1</b> Scannez avec l’appareil photo</span>
        <span class="sep">→</span>
        <span><b>2</b> Votre carte en 30 secondes</span>
        <span class="sep">→</span>
        <span><b>3</b> 9 tampons, <em>la 10ᵉ coupe est offerte</em></span>
      </div>

      <div class="display-foot">
        <span id="displayClock">--:--</span>
        <span class="dot-sep">·</span> {{ADDRESS}}
        <span class="dot-sep">·</span> {{HOURS}}
        <span class="dot-sep">·</span> <span>Tampon uniquement par le barbier</span>
      </div>
    </div>
    <div class="display-stripe bottom"></div>
  </div>

  
  <script>
    (function () {
      var clockEl = document.getElementById('displayClock');
      function tickClock() { clockEl.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
      tickClock(); setInterval(tickClock, 1000);
    })();
  </script>
</body>
</html>
